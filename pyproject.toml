[project]
name = "agent_creator_research"
version = "1.0.0"
description = "Agent repository: the specialist agent responsible for finding and analyzing relevant creators."
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Runtime dependencies are sibling child repositories (linkgen_contracts,
# linkgen_config, agent-framework, providers/llm). They are not installable
# from PyPI; tests resolve them through conftest.py by appending
# ../../<child>/src to sys.path (mirroring parent compose-time resolution).
